# Render blueprint. Push this file, then in Render: New > Blueprint > pick repo.
# Everything below is created for you, including HTTPS.
services:
  - type: web
    name: physiomind
    runtime: python
    region: singapore          # closest Render region to India
    plan: free
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /api/health

    # --proxy-headers is REQUIRED here. Render terminates TLS at its edge and
    # proxies to this service, so without it request.client.host is Render's
    # internal proxy address -- the same for every visitor, which would
    # collapse the per-address rate limit into one global budget.
    #
    # forwarded-allow-ips='*' is safe ONLY because this service is unreachable
    # except through Render's proxy; nothing else can set the header.
    startCommand: >-
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'

    envVars:
      - key: PHYSIO_SECRET_KEY
        generateValue: true          # Render generates and stores it for you
      - key: PHYSIO_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.9"

    # No database is configured on purpose. Accounts are disabled, so nothing
    # is written: exercise sessions are scored and returned, never stored.
    # PHYSIO_DATABASE_URL therefore falls back to a local SQLite file that
    # stays empty, and the free plan's lack of a disk costs nothing.
    #
    # Turning accounts back on means giving this real storage -- either a
    # `starter` plan with a 1 GB disk at /data plus
    # PHYSIO_DATABASE_URL=sqlite:////data/physio.db, or a free hosted Postgres
    # (Neon) in PHYSIO_DATABASE_URL with psycopg2-binary added back to
    # requirements.txt.
